<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash - AI all in one personal dashboard</title>
    <link rel="stylesheet" href="dash.css">
 
</head>
<body>
    <h1><b>Hi, I'm Dash - Your AI Personal Dashboard</b></h1>
<div class="dashboard"> 

        <section class="card clock">
        <h2>Date and Time</h2>
        <!-- Clock content -->    
        <div id="date"></div>
        <div id="time"></div>
    </section>

    <section class="card calendar">
        <h2>Calendar</h2>
        <!-- Calendar content -->
         <h2>This Week</h2>
        <button id="authorize_button" onclick="handleAuthClick()">
        Connect Google Calendar
        </button>
        <div id="calendar"></div>
    </section>

    <section class="card weather">
        <h2>Weather</h2>
        <!-- Weather content -->
        <p>Weather: 98 degrees and sunny</p>
    </section>

    <section class="card todo">
        <h2>To-Do</h2>
        <!-- Todo content -->
         <div id="tasks"></div>
    </section>

    <section class="card music">
        <h2>Music</h2>
        <!-- Music controls -->
        <p>Currently playing: Blinding Lights</p>
    </section>

    <section class="card github">
        <h2>github</h2>
        <p>Github: You have 3 new notifications</p>
    </section>

    <section class="card system-stats">
        <h2>System Stats</h2>
        <!-- System stats content -->
        <p>CPU Usage: 45%</p>

    </section>

    <section class="card assistant">
        <h2>Dash Assistant</h2>
        <!-- AI Assistant content -->
        <p>Ask me anything!</p>
    </section>


</div>
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<script src="script.js"></script>

<script>
    gapiLoaded();
    gisLoaded();
</script>
</body>
<script src="clock.js"></script>
<script src=""></script>
<script src=""></script>
<script src=""></script>
<script src=""></script>
</html>
