<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash - AI all in one personal dashboard</title>
    <link rel="stylesheet" href="dash.css">
 
</head>
<body>
    <h1><b>Hi, I'm Dash - Your AI Personal Dashboard</b></h1>
<div class="dashboard"> 

<section class="card clock-weather">

    <div class="clock-content">
        <div id="time"></div>
        <div id="date"></div>
    </div>

    <div class="weather-content" id="weather"></div>

</section>

    <section class="card calendar">
        <!-- Calendar content -->
         <h2>This Week</h2>
        <button id="authorize_button" onclick="handleAuthClick()">
        Connect Google Calendar
        </button>
        <div id="calendar"></div>
    </section>


    <section class="card todo">
        <h2>To-Do</h2>
        <!-- Todo content -->
         <div id="tasks"></div>
    </section>

    <section class="card music">
        <h2>Music</h2>
        <!-- Music controls -->
        <p>Currently playing: Blinding Lights</p>
    </section>

    <section class="card github">
    <h2>github</h2>
    <div id="github-content">Loading...</div>
</section>
            

    <section class="card system-stats">
        <h2>System Stats</h2>
        <!-- System stats content -->
       <div id="system-stats"></div>

    </section>

    <section class="card assistant">
        <h2>Dash Assistant</h2>
        <!-- AI Assistant content -->
        <p>Ask me anything!</p>
    </section>


</div>
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<script src="script.js"></script>

<script>
    gapiLoaded();
    gisLoaded();
</script>
</body>
<script src="clock.js"></script>
<script src=""></script>
<script src=""></script>
<script src=""></script>
<script src=""></script>
</html>
